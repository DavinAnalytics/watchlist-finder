<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Watchlist</title>
<style>
  :root {
    --bg: #12110f;
    --card: #1b1917;
    --line: #2e2b27;
    --text: #ece7df;
    --dim: #97918a;
    --accent: #e0b872;
    --gone: #b8736a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf7f2; --card: #fff; --line: #e5ded2;
      --text: #22201d; --dim: #6d675f; --accent: #8a6414; --gone: #9c463a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem 1rem 4rem;
    background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 .15rem; letter-spacing: -.01em; }
  .stamp { color: var(--dim); font-size: .8rem; margin: 0 0 1.25rem; }
  .stale {
    background: var(--gone); color: #fff; padding: .6rem .8rem;
    border-radius: .5rem; font-size: .85rem; margin: 0 0 1rem;
  }
  .counts { display: flex; gap: .5rem; margin: 0 0 1.75rem; }
  .counts div {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: .6rem; padding: .7rem .5rem; text-align: center;
  }
  .counts b { display: block; font-size: 1.5rem; font-weight: 600; line-height: 1.1; }
  .counts span { color: var(--dim); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
  h2 {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); font-weight: 600; margin: 2rem 0 .6rem;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: var(--card); border: 1px solid var(--line);
    border-radius: .6rem; padding: .65rem .8rem; margin-bottom: .4rem;
  }
  .title { font-weight: 600; }
  .meta { color: var(--dim); font-size: .82rem; margin-top: .1rem; }
  .meta .on { color: var(--accent); }
  .empty { color: var(--dim); font-size: .9rem; padding: .2rem 0 .4rem; }
  footer { color: var(--dim); font-size: .75rem; margin-top: 3rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Watchlist</h1>
  <p class="stamp">$generated</p>
  $stale_banner
  <div class="counts">
    <div><b>$count_streaming</b><span>streaming</span></div>
    <div><b>$count_new</b><span>new</span></div>
    <div><b>$count_gone</b><span>gone</span></div>
  </div>

  <h2>New since $prev_label</h2>
  $section_new

  <h2>Under 100 minutes</h2>
  $section_short

  <h2>Everything streaming</h2>
  $section_streaming

  <h2>Favorites streaming · rewatch</h2>
  $section_favorites

  <footer>$footer</footer>
</main>
</body>
</html>
