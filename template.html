<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Watchlist</title>
<style>
  /* Palette, type and component language ported from the "Organic" design
     system (claude.ai/design). That system is light-only; the dark values
     below are hand-derived, keeping the same hue family and following its own
     documented elevation strategy — shadows on light, a hairline edge on dark
     — rather than a naive invert. */
  @import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');

  :root {
    --bg: #1c1712;
    --surface: #29221b;
    --text: #f3ead9;
    --dim: color-mix(in srgb, var(--text) 55%, transparent);
    --divider: color-mix(in srgb, var(--text) 16%, transparent);
    --accent: #e2955c;
    --accent-2: #ccdbb2;
    --banner-bg: color-mix(in srgb, var(--accent) 20%, var(--bg));
    --banner-fg: color-mix(in srgb, var(--accent) 78%, var(--text));
    --poster-a: #332b22;
    --poster-b: #241e18;
    --poster-label: #b6ab98;
    --neutral-tag-bg: color-mix(in srgb, var(--text) 12%, transparent);
    --backdrop: color-mix(in srgb, black 55%, transparent);
    --shadow-sm: none;
    --shadow-lg: none;
    --elev-border: 1px solid var(--divider);
    --font-heading: "Caprasimo", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, sans-serif;
    --radius-card: 1.9rem;
    --radius-tag: 999px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5ead8;
      --surface: #ebddc5;
      --text: #201e1d;
      --accent: #c67139;
      --accent-2: #56633f;
      --banner-bg: #fff2eb;
      --banner-fg: #643312;
      --poster-a: #eee7db;
      --poster-b: #dcd3c4;
      --poster-label: #82796a;
      --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
      --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
      --elev-border: none;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem 1rem 4rem;
    background: var(--bg); color: var(--text);
    font: 400 16px/1.55 var(--font-body);
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 27.5rem; margin: 0 auto; }
  h1 {
    font-family: var(--font-heading); font-weight: 400;
    font-size: 1.7rem; margin: 0 0 .3rem; letter-spacing: -.015em;
  }
  .stamp { color: var(--dim); font-size: .8rem; margin: 0 0 1.25rem; }

  .stale {
    background: var(--banner-bg); color: var(--banner-fg);
    padding: .7rem .9rem; border-radius: 1rem; font-size: .85rem; margin: 0 0 .6rem;
  }

  .counts { display: flex; gap: .55rem; margin: 0 0 1.9rem; }
  .counts div {
    flex: 1; background: var(--surface); border: var(--elev-border);
    box-shadow: var(--shadow-sm); border-radius: var(--radius-card);
    padding: .8rem .5rem; text-align: center; display: flex; flex-direction: column; gap: .1rem;
  }
  .counts b {
    font-family: var(--font-heading); font-weight: 400;
    font-size: 1.55rem; line-height: 1.1;
  }
  .counts .new b { color: var(--accent-2); }
  .counts span { color: var(--dim); font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; }

  h2 {
    font-family: var(--font-heading); font-weight: 400;
    font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 2rem 0 .7rem;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: .5rem; }
  .row-card {
    display: flex; align-items: center; gap: .75rem;
    background: var(--surface); border: var(--elev-border); box-shadow: var(--shadow-sm);
    border-radius: var(--radius-card); padding: .6rem .7rem;
    text-decoration: none; color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .row-card:active { opacity: .85; }
  .row-card-off {
    box-shadow: none; border: 1px solid var(--divider);
    padding: .55rem .75rem; opacity: .62;
  }
  .poster {
    flex: none; width: 3.25rem; height: 4.875rem; border-radius: .65rem;
    object-fit: cover; background: var(--poster-b);
  }
  .poster-placeholder {
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, var(--poster-a) 0 6px, var(--poster-b) 6px 12px);
    font: 600 7px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
    color: var(--poster-label);
  }
  .row-info { flex: 1; min-width: 0; }
  .card-title { font-family: var(--font-heading); font-weight: 400; font-size: 1rem; }
  .row-card-off .card-title { font-family: var(--font-body); font-weight: 600; font-size: .875rem; }
  .card-meta { color: var(--dim); font-size: .8rem; margin-top: .15rem; }

  .tag-row { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .45rem; }
  .tag {
    --tag-bg: color-mix(in srgb, var(--tag-color) 16%, var(--bg));
    --tag-fg: color-mix(in srgb, var(--tag-color) 62%, var(--text));
    display: inline-flex; align-items: center; font-size: .7rem;
    letter-spacing: .01em; padding: .2rem .6rem; border-radius: var(--radius-tag);
    background: var(--tag-bg); color: var(--tag-fg);
  }
  .tag-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--tag-color);
    display: inline-block; margin-right: .35rem;
  }
  .tag-neutral { background: var(--neutral-tag-bg); color: var(--dim); }
  .tag-upcoming {
    background: color-mix(in srgb, var(--accent) 16%, var(--bg));
    color: color-mix(in srgb, var(--accent) 78%, var(--text));
  }

  .empty { color: var(--dim); font-size: .9rem; padding: .2rem 0 .4rem; }

  .hidden-list { margin-top: .3rem; }
  .hidden-list summary {
    cursor: pointer; color: var(--dim); font-size: .82rem;
    padding: .5rem .2rem; list-style: none; user-select: none;
  }
  .hidden-list summary::-webkit-details-marker { display: none; }
  .hidden-list summary::before { content: "▸ "; }
  .hidden-list[open] summary::before { content: "▾ "; }
  .hidden-list summary:hover { color: var(--text); }

  footer { color: var(--dim); font-size: .75rem; margin-top: 3rem; text-align: center; }

  /* Detail dialogs: pure CSS, driven by :target. Tapping a row navigates to
     #m{id}; tapping the backdrop, the close button, or the browser's back
     gesture navigates away from it. No JavaScript, nothing recomputed —
     every field here is HTML render.py already wrote to the page. */
  .dialog-target { display: none; }
  .dialog-target:target {
    display: block; position: fixed; inset: 0; z-index: 50;
  }
  .dialog-backdrop {
    position: absolute; inset: 0; background: var(--backdrop);
    -webkit-tap-highlight-color: transparent;
  }
  .dialog {
    position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto;
    width: 100%; max-width: 27.5rem;
    display: flex; flex-direction: column; gap: .85rem;
    padding: 1.4rem 1.2rem 1.6rem; border-radius: 1.75rem 1.75rem 0 0;
    background: var(--surface); box-shadow: var(--shadow-lg); border: var(--elev-border);
  }
  .dialog-close {
    position: absolute; top: .7rem; right: .7rem; width: 2.1rem; height: 2.1rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: color-mix(in srgb, var(--text) 8%, transparent);
    color: var(--text); text-decoration: none; font-size: .85rem;
    -webkit-tap-highlight-color: transparent;
  }
  .dialog-head { display: flex; gap: 1rem; }
  .dialog-poster { width: 5.25rem; height: 7.875rem; border-radius: .8rem; }
  .dialog-title { font-family: var(--font-heading); font-weight: 400; font-size: 1.25rem; }
  .text-muted { color: var(--dim); }
  .score { font-size: .8rem; color: var(--accent); margin-top: .3rem; font-weight: 600; }
  .dialog-body { font-size: .88rem; color: var(--text); opacity: .9; margin: 0; }
  .dialog-link { font-size: .8rem; color: var(--dim); margin: 0; }
  .dialog-link a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Watchlist</h1>
  <p class="stamp">$generated</p>
  $stale_banner
  <div class="counts">
    <div><b>$count_streaming</b><span>streaming</span></div>
    <div class="new"><b>$count_new</b><span>new</span></div>
    <div><b>$count_gone</b><span>gone</span></div>
  </div>

  <h2>New since $prev_label</h2>
  $section_new

  <h2>Watchlist streaming</h2>
  $section_streaming
  $section_watchlist_hidden

  <h2>Favorites streaming · rewatch</h2>
  $section_favorites
  $section_favorites_hidden

  <footer>$footer</footer>
</main>
$dialogs
</body>
</html>
